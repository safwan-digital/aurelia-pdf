name: tests

# Publish gates (see TEST-REPORT.md, "Publish checklist").
# CI currently runs the syntax gate. The full headless suites
# (tests/ui-test.js, v3-checks.js, qc-v41.js, qc-v412.js) run locally
# before every publish, because the tests/ folder is not committed yet.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check app.js
